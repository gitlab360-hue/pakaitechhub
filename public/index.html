<style>
:root{--bg:#050914;--ink:#eef2ff;--mut:#9aa9c9;--a:#22d3ee;--b:#6366f1;--line:rgba(255,255,255,.08);--r:22px;--ok:#34d399}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(1000px 560px at 12% -8%,rgba(99,102,241,.24),transparent 60%),radial-gradient(900px 520px at 92% 4%,rgba(34,211,238,.17),transparent 60%),radial-gradient(1000px 640px at 50% 112%,rgba(99,102,241,.15),transparent 60%)}
body:after{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000 15%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0,#000 15%,transparent 70%)}
a{color:inherit;text-decoration:none}
img{max-width:100%}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
section{padding:104px 0;position:relative}
section+section:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(1100px,86%);height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
h1,h2,h3{font-family:Sora,Inter,sans-serif;letter-spacing:-.025em;text-wrap:balance}
h1{font-size:clamp(36px,6vw,68px);line-height:1.04;font-weight:800}
h2{font-size:clamp(28px,4.2vw,46px);line-height:1.1;font-weight:800;margin-bottom:14px}
h3{font-size:18px;font-weight:700;line-height:1.3}
.grad{background:linear-gradient(95deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{display:inline-flex;gap:10px;align-items:center;color:var(--a);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;margin-bottom:16px}
.eyebrow:before{content:"";width:26px;height:2px;background:linear-gradient(90deg,var(--a),transparent)}
.lead{color:var(--mut);font-size:17.5px;max-width:660px}
.center{text-align:center}.center .lead{margin:0 auto}.center .eyebrow{justify-content:center}
.sh{margin-bottom:8px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);cursor:pointer;font:600 14.5px Inter,sans-serif;transition:.25s;overflow:hidden;white-space:nowrap}
.btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.28)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.p{background:linear-gradient(95deg,var(--a),var(--b));border:0;color:#03101f;box-shadow:0 12px 32px -10px var(--a)}
.btn.p:hover{box-shadow:0 16px 40px -8px var(--a)}
.btn.p:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 4.5s infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn.wa{background:#25d366;border:0;color:#04210f}
.btn.sm{padding:9px 15px;font-size:12.5px;border-radius:10px}
.g{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;transition:border-color .3s,transform .3s}
.g:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:.3s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0),rgba(34,211,238,.13),transparent 45%)}
.g:hover{border-color:rgba(255,255,255,.2)}.g:hover:after{opacity:1}
.pad{padding:28px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:52px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}*{animation:none!important}}
/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:40;transition:.3s}
nav.sc{background:rgba(5,9,20,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:26px;height:76px}
.logo{display:flex;align-items:center;gap:11px;font:800 19px Sora,sans-serif;letter-spacing:-.02em}
.logo img,.logo i{width:36px;height:36px;border-radius:10px;object-fit:contain}
.logo i{display:inline-block;flex:none;background:linear-gradient(135deg,var(--a),var(--b))}
.links{display:flex;gap:28px;margin-left:auto;font-size:14px;color:var(--mut);font-weight:500}
.links a{transition:.2s;position:relative}.links a:hover{color:#fff}
.burger{display:none;margin-left:auto;background:none;border:0;color:#fff;font-size:26px;cursor:pointer}
@media(max-width:960px){.links{display:none;position:absolute;top:76px;left:0;right:0;flex-direction:column;gap:0;background:rgba(5,9,20,.97);border-bottom:1px solid var(--line);margin:0}.links a{padding:17px 24px;border-top:1px solid var(--line)}nav.open .links{display:flex}.burger{display:block}nav .btn.hide-m{display:none}}
/* hero */
header{padding:158px 0 60px;position:relative}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
@media(max-width:960px){.hero{grid-template-columns:1fr}}
.pill{display:inline-flex;gap:9px;align-items:center;padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:13px;color:var(--mut);margin-bottom:26px}
.pill b{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.18)}
.hero .lead{margin:24px 0 34px;font-size:18.5px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:560px){.cta .btn{width:100%}section{padding:76px 0}header{padding-top:128px}.wrap{padding:0 20px}.pad{padding:22px}.pimg{margin:-22px -22px 20px}.tier{flex-wrap:wrap}.tier .pr{margin-left:64px}}
.ticks{display:flex;gap:10px 24px;flex-wrap:wrap;margin-top:30px;color:var(--mut);font-size:13.5px}
.ticks span:before{content:"✓";color:var(--a);font-weight:800;margin-right:8px}
.hvw{position:relative}
.hv{padding:22px;animation:float 7s ease-in-out infinite}
.hvimg{padding:0;aspect-ratio:4/3;box-shadow:0 40px 100px -30px rgba(34,211,238,.35)}
.hvimg img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes float{50%{transform:translateY(-12px)}}
.hv-top{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin-bottom:16px}
.hv-top .dot{width:9px;height:9px;border-radius:50%;background:#ef4444;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.3}}
.wave{display:flex;gap:3px;align-items:center;height:56px}
.wave i{flex:1;height:14%;border-radius:4px;background:linear-gradient(var(--a),var(--b));animation:w 1.1s ease-in-out infinite;animation-delay:calc(var(--i)*-.08s);animation-play-state:paused}
.wave.live i{animation-play-state:running}
@keyframes w{50%{height:100%}}
.bub{max-width:90%;padding:11px 15px;border-radius:15px;font-size:14px;margin-top:11px}
.bub.a{background:rgba(255,255,255,.07);border:1px solid var(--line)}
.bub.u{margin-left:auto;background:linear-gradient(95deg,var(--b),#4f46e5)}
.fchip{position:absolute;padding:9px 15px;border-radius:99px;font-size:12.5px;font-weight:600;background:rgba(9,15,34,.88);border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:0 14px 40px -12px rgba(0,0,0,.6);animation:float 6s ease-in-out infinite}
.fchip.c1{top:-16px;right:18px}.fchip.c2{bottom:-16px;left:18px;animation-delay:-3s}
.statbar{display:grid;grid-template-columns:repeat(4,1fr);margin-top:76px;padding:8px 0}
.stat{padding:22px 26px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{font:800 40px Sora,sans-serif;display:block;line-height:1.1}
.stat span{color:var(--mut);font-size:13.5px}
@media(max-width:760px){.statbar{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.mq{overflow:hidden;border-block:1px solid var(--line);padding:20px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq div{display:flex;gap:50px;width:max-content;animation:mq 38s linear infinite;color:var(--mut);font:600 15px Sora,sans-serif;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
/* cards */
.ic{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(99,102,241,.2));border:1px solid var(--line);margin-bottom:18px;overflow:hidden;flex:none}
.ic img{width:100%;height:100%;object-fit:cover}
.card p{color:var(--mut);font-size:14.5px;margin-top:9px}
.svc{display:flex;flex-direction:column}
.svc ul{list-style:none;margin:16px 0 0;display:grid;gap:7px}
.svc li{font-size:13.5px;color:#c4d0ea}
.svc li:before{content:"✓";color:var(--a);font-weight:800;margin-right:9px}
.more{margin-top:auto;padding-top:18px;color:var(--a);font-size:13.5px;font-weight:600}
.num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:800 15px Sora;background:linear-gradient(135deg,var(--a),var(--b));color:#03101f;margin-bottom:18px}
.badge{display:inline-block;font-size:11px;padding:5px 12px;border-radius:99px;background:rgba(34,211,238,.12);color:var(--a);font-weight:700;margin-bottom:14px;letter-spacing:.05em}
.pimg{margin:-28px -28px 22px;aspect-ratio:16/9;background:rgba(255,255,255,.03);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.g:hover .pimg img{transform:scale(1.05)}
.pcard{display:flex;flex-direction:column}
.pcard .btn{margin-top:auto;align-self:flex-start}
.price{font:800 28px Sora;margin:18px 0}
.feat{background:linear-gradient(#0a1124,#0a1124) padding-box,linear-gradient(135deg,var(--a),var(--b)) border-box;border:1px solid transparent;box-shadow:0 40px 90px -40px rgba(34,211,238,.4)}
.tier{display:flex;gap:18px;align-items:center;padding:20px 24px}
.tier .n{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font:800 17px Sora;background:linear-gradient(135deg,var(--a),var(--b));color:#03101f;flex:none}
.tier .pr{margin-left:auto;font:800 18px Sora;white-space:nowrap}
.tier small{display:block;color:var(--mut);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.tags span{font-size:12px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
.facts div{padding:13px 16px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:13.5px}
.aimg{border-radius:var(--r);overflow:hidden;margin-bottom:22px;aspect-ratio:16/10}
.aimg img{width:100%;height:100%;object-fit:cover;display:block}
.pf{width:56px;height:56px;border-radius:50%;object-fit:cover;margin-bottom:12px;border:2px solid var(--line)}
.band{padding:64px 44px;text-align:center;background:linear-gradient(135deg,rgba(34,211,238,.15),rgba(99,102,241,.22))}
/* demo */
.demo{display:grid;grid-template-columns:.9fr 1.3fr;gap:22px;margin-top:52px}
@media(max-width:900px){.demo{grid-template-columns:1fr}}
label{display:block;font-size:12.5px;color:var(--mut);margin:15px 0 6px;font-weight:500}
input,select,textarea{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(4,9,22,.7);color:var(--ink);font:inherit;font-size:14.5px;outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
select option{background:#0a1226}
.mic{width:88px;height:88px;border-radius:50%;border:0;cursor:pointer;font-size:34px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 14px 44px -8px var(--a);transition:.25s}
.mic:hover{transform:scale(1.06)}
.mic.rec{background:#ef4444;animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}100%{box-shadow:0 0 0 26px rgba(239,68,68,0)}}
.chat{height:340px;overflow:auto;display:flex;flex-direction:column;gap:11px;padding:6px 6px 6px 0}
.chat::-webkit-scrollbar{width:6px}.chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.msg{max-width:88%;padding:12px 16px;border-radius:16px;font-size:14.5px;animation:pop .3s}
.msg[dir=rtl]{font-family:'Noto Naskh Arabic',serif;font-size:17px;line-height:2}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.msg.u{align-self:flex-end;background:linear-gradient(95deg,var(--b),#4f46e5)}
.msg.a{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:tp 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{opacity:.25;transform:translateY(-3px)}}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.sug button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mut);font:500 12.5px Inter;cursor:pointer;transition:.2s}
.sug button:hover{color:#fff;border-color:var(--a)}
.row{display:flex;gap:10px;align-items:center}
.hint{font-size:12.5px;color:var(--mut);margin-top:10px}
/* faq */
details{margin-top:12px;padding:21px 26px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.3s}
details[open]{border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.04)}
summary{cursor:pointer;font:600 16.5px Sora;list-style:none;display:flex;justify-content:space-between;gap:14px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--a);font-size:23px;line-height:1}
details[open] summary:after{content:"–"}
details p{color:var(--mut);margin-top:13px;font-size:15.5px}
/* contact */
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:640px){.f2{grid-template-columns:1fr}}
.chk{display:flex;gap:11px;align-items:flex-start;margin-top:18px;font-size:13px;color:var(--mut)}
.chk input{width:auto;margin-top:3px}
.msgok{display:none;margin-top:18px;padding:15px 18px;border-radius:13px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35);color:#a7f3d0;font-size:14.5px}
.msgok.err{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.4);color:#fecaca}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.cinfo p{margin:13px 0;color:var(--mut)}
.cinfo a{color:var(--a)}
.soc{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:64px 0 30px;margin-top:20px}
.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:34px}
@media(max-width:800px){.fg{grid-template-columns:1fr 1fr}}
footer h4{font:700 13px Sora;margin-bottom:14px;letter-spacing:.04em}
footer a{display:block;color:var(--mut);font-size:14px;margin:9px 0;transition:.2s}footer a:hover{color:#fff}
.fb{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:40px;padding-top:22px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
.fb button{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit}
.fab{position:fixed;right:22px;bottom:22px;z-index:35;width:60px;height:60px;border-radius:50%;background:#25d366;display:none;place-items:center;box-shadow:0 14px 36px -6px #25d366;transition:.25s}
.fab:hover{transform:scale(1.1)}
.fab svg{width:31px;height:31px;fill:#fff}
.wa-only{display:none}
/* ADMIN */
#admin{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:100;background:#070d1d;border-left:1px solid var(--line);box-shadow:-30px 0 80px rgba(0,0,0,.6);transform:translateX(105%);transition:transform .35s;display:flex;flex-direction:column;font-size:14px}
#admin.open{transform:none}
.ah{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.ah b{font:700 16px Sora}.ah .lv{font-size:12px;color:var(--ok);margin-left:auto}.ah .lv.dirty{color:#fbbf24}
.ah button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.ab{flex:1;overflow:auto;padding:16px 18px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{white-space:nowrap;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;font-size:12.5px;color:var(--mut)}
.tab.on{background:linear-gradient(95deg,var(--a),var(--b));color:#03101f;border:0;font-weight:700}
.item{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:13px;background:rgba(255,255,255,.025)}
.item>label:first-child{margin-top:0}
.lh{font:700 13px Sora;margin:20px 0 12px;color:var(--a);letter-spacing:.05em;text-transform:uppercase}
.af{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line);background:#050a17}
.af .btn{flex:1;min-width:110px}
.warn{color:#fbbf24}.good{color:var(--ok)}
.ld{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.sw input{width:auto}
.imgf{display:flex;gap:12px;align-items:center}
.th{width:74px;height:74px;border-radius:12px;border:1px dashed rgba(255,255,255,.18);display:grid;place-items:center;overflow:hidden;font-size:28px;flex:none;background:rgba(255,255,255,.03);color:var(--mut)}
.th img{width:100%;height:100%;object-fit:contain}.th audio{width:68px;height:30px}.th span{font-size:11px;text-align:center;line-height:1.2}
label.up{display:inline-flex;margin:0;cursor:pointer;color:var(--ink)}
</style>
</head>
<body>

<nav id="nav"><div class="wrap">
  <a class="logo" href="#top"><span id="logoBox"></span><span id="brand"></span></a>
  <div class="links" id="links"></div>
  <a class="btn p sm hide-m" href="#contact" id="navCta">Get in touch</a>
  <button class="burger" id="burger" aria-label="Menu">☰</button>
</div></nav>

<header id="top"><div class="wrap">
  <div class="hero">
    <div class="rv">
      <div class="pill"><b></b><span id="heroBadge"></span></div>
      <h1 id="heroTitle"></h1>
      <p class="lead" id="heroSub"></p>
      <div class="cta">

 if(/natural|neural/.test(n))s+=80;if(/online/.test(n))s+=40;if(/premium|enhanced|studio/.test(n))s+=60;if(/google/.test(n))s+=25;if(/siri/.test(n))s+=30;if(/microsoft/.test(n))s+=10;

function chunks(t){const parts=t.match(/[^.!?۔؟]+[.!?۔؟]*/g)||[t];const out=[];let cur='';parts.forEach(p=>{if((cur+p).length>170&&cur){out.push(cur);cur=p}else cur+=p});if(cur)out.push(cur);return out.map(s=>s.trim()).filter(Boolean)}

function readDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function shrink(file){
 return new Promise((res,rej)=>{
  if(/gif|icon/.test(file.type)||file.size<120*1024){readDataUrl(file).then(res,rej);return}
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/webp',.85))};
  img.onerror=()=>rej(new Error('Image read nahi hui'));img.src=u;
 });
}

$('aSave').onclick=async()=>{
 if(serverMode){
  try{await api('PUT','/api/config',cfg);saved=JSON.stringify(cfg);dirty=false;updateLv();greet();flash('Saved ✓ — site live ho gayi')}
  catch(e){if(e.status===401){showLogin('Session khatam — dobara login karein')}else flash('Save failed: '+e.message,true)}
  return;
 }
 const np=$('newPw');if(np&&np.value){localStorage.setItem(PWK,hash(np.value));np.value=''}
 try{localStorage.setItem(LS,JSON.stringify(cfg));localStorage.setItem(SEEN,'1')}catch(e){flash('Storage full — images chhoti karein ya server mode use karein',true);return}
 saved=JSON.stringify(cfg);dirty=false;updateLv();greet();flash('Saved ✓ (is browser mein)');
};
$('aPub').onclick=()=>{dl('site-config.json',JSON.stringify(cfg,null,2),'application/json');flash('site-config.json download ho gayi — hosting par upload karein')};
$('aDiscard').onclick=()=>{cfg=merge(DEFAULT,sj(saved));dirty=false;updateLv();render();greet();drawTab();flash('Changes discard')};
function showLogin(msg){$('panel').style.display='none';$('login').style.display='block';$('aOut').style.display='none';$('lv').style.display='none';if(msg)$('loginHint').textContent=msg}
function openPanel(){saved=JSON.stringify(cfg);dirty=false;$('login').style.display='none';$('panel').style.display='flex';$('aSave').textContent=serverMode?'💾 Save & Go Live':'💾 Save';$('aPub').style.display=serverMode?'none':'';$('aOut').style.display=serverMode?'inline':'none';drawTabs();drawTab();updateLv()}
async function openAdmin(){
 adm.classList.add('open');
 $('loginHint').textContent=serverMode?'Server password (pehli dafa server console mein dikhta hai, ya ADMIN_PASSWORD).':'Default password: admin123 — login ke baad Settings mein badal lein.';
 if(serverMode&&$('panel').style.display==='none'){try{const p=await api('GET','/api/ping');if(p.authed)openPanel()}catch(e){}}
}
function closeAdmin(){adm.classList.remove('open')}
$('openAdmin').onclick=openAdmin;$('aClose').onclick=closeAdmin;
$('aOut').onclick=async()=>{try{await api('POST','/api/logout',{})}catch(e){}showLogin('Logged out');};
$('doLogin').onclick=async()=>{
 const v=$('pw').value;
 if(serverMode){
  try{await api('POST','/api/login',{password:v});$('pw').value='';openPanel()}
  catch(e){$('pw').value='';$('loginHint').textContent=e.status===429?'Bohat zyada attempts — thori der baad try karein':'Wrong password'}
 }else if(hash(v)===(localStorage.getItem(PWK)||hash('admin123'))){$('pw').value='';openPanel()}
 else{$('pw').value='';$('loginHint').textContent='Wrong password'}
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('doLogin').click()});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
if(location.hash==='#admin')openAdmin();
addEventListener('hashchange',()=>{if(location.hash==='#admin')openAdmin()});

/* ================= boot ================= */
(async function boot(){
 if(typeof window.__CFG!=='undefined'){serverMode=true;base=merge(DEFAULT,window.__CFG)}
 else{
  try{const c=new AbortController(),to=setTimeout(()=>c.abort(),2500);const r=await fetch('site-config.json?'+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(to);if(r.ok)base=merge(DEFAULT,await r.json())}catch(e){}
 }
 applyLocal();render();drawSug();greet();loadVoices();
 if(location.hash==='#admin')openAdmin();
})();
</script>
</body>
</html>
